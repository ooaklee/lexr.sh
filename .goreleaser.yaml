version: 2

project_name: lexr
dist: dist

gomod:
  dir: .

builds:
  - id: lexr
    dir: .
    main: ./cmd/lexr
    binary: lexr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/ooaklee/lexr.sh/internal/version.Version={{ .Version }}
        -X github.com/ooaklee/lexr.sh/internal/version.Commit={{ .FullCommit }}
        -X github.com/ooaklee/lexr.sh/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: release-archives
    ids:
      - lexr
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: README.md
        strip_parent: true
      - src: CHANGELOG.md
        strip_parent: true
      - src: supported-isos.json
        strip_parent: true
      - src: supported-userspace.json
        strip_parent: true
      - src: tools/collect-sp11-windows-handoff.ps1
        strip_parent: true
      - src: "{{ .Env.LEXR_LICENCE_DOCUMENT }}"
        strip_parent: true
      - src: "{{ .Env.LEXR_THIRD_PARTY_NOTICES_DOCUMENT }}"
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  make_latest: false
