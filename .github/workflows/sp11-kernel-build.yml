# SPDX-License-Identifier: GPL-2.0-only

name: Build SP11 kernel

on:
  workflow_dispatch:
    inputs:
      git-url:
        description: "Kernel Git URL"
        required: true
        default: "https://github.com/ooaklee/linux_ms_dev_kit-sp11.git"
        type: string
      git-branch:
        description: "Kernel Git branch or tag"
        required: true
        default: "sp11/integration-7.2.x"
        type: string
      jobs:
        description: "Parallel build jobs"
        required: false
        default: "8"
        type: string
      release:
        description: "Create a GitHub prerelease after a successful build"
        required: false
        default: false
        type: boolean
      release-name:
        description: "Release tag name (derived from the ABI when empty)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sp11-kernel-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request:
    name: Validate publication request
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require Lexr main for OE publication
        if: ${{ inputs.release && github.ref != 'refs/heads/main' }}
        run: |
          printf 'OE kernel publication is permitted only from Lexr main.\n' >&2
          exit 1

  build:
    name: Build kernel
    needs: request
    runs-on:
      - self-hosted
      - linux
      - lexr-kernel
    timeout-minutes: 1200
    defaults:
      run:
        shell: bash

    outputs:
      release-name: ${{ steps.release-assets.outputs.release-name }}

    steps:
      - name: Validate the dedicated kernel runner
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|aarch64|arm64) ;;
            *)
              printf 'The lexr-kernel runner must be Linux x86-64 or ARM64.\n' >&2
              exit 1
              ;;
          esac
          if ! docker info >/dev/null 2>&1; then
            printf 'The lexr-kernel runner requires an accessible Docker daemon.\n' >&2
            exit 1
          fi

          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          docker_free_kib="$(df -Pk "${docker_root}" | awk 'NR == 2 { print $4 }')"
          workspace_free_kib="$(df -Pk "${GITHUB_WORKSPACE}" | awk 'NR == 2 { print $4 }')"
          if [[ ! "${docker_free_kib}" =~ ^[0-9]+$ ]] ||
             (( docker_free_kib < 64 * 1024 * 1024 )); then
            printf 'The lexr-kernel runner requires at least 64 GiB free in Docker storage.\n' >&2
            exit 1
          fi
          if [[ ! "${workspace_free_kib}" =~ ^[0-9]+$ ]] ||
             (( workspace_free_kib < 8 * 1024 * 1024 )); then
            printf 'The lexr-kernel runner requires at least 8 GiB free in its Actions workspace.\n' >&2
            exit 1
          fi

      - name: Check out Lexr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum

      - name: Set up ARM64 emulation
        if: ${{ runner.arch == 'X64' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Compile Lexr
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -o "${RUNNER_TEMP}/lexr" ./cmd/lexr

      - name: Build the kernel with the native CLI
        env:
          KERNEL_GIT_URL: ${{ inputs.git-url }}
          KERNEL_GIT_BRANCH: ${{ inputs.git-branch }}
          KERNEL_JOBS: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          if [[ ! "${KERNEL_JOBS}" =~ ^(0|[1-9][0-9]{0,2})$ ]] ||
             (( 10#${KERNEL_JOBS} > 512 )); then
            printf 'Parallel build jobs must be a canonical integer from 0 through 512.\n' >&2
            exit 1
          fi
          source_identity="$(printf '%s' "${KERNEL_GIT_URL}" | sha256sum | awk '{ print $1 }')"
          if [[ ! "${source_identity}" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Could not derive a stable kernel source identity.\n' >&2
            exit 1
          fi
          "${RUNNER_TEMP}/lexr" kernel build \
            --repository-root "${GITHUB_WORKSPACE}" \
            --git-url "${KERNEL_GIT_URL}" \
            --git-branch "${KERNEL_GIT_BRANCH}" \
            --work-dir "build/lexr/kernel-build-ci-${source_identity}" \
            --output-dir build/lexr/kernel-ci \
            --reset-source \
            --jobs "${KERNEL_JOBS}" |
            sed -E 's#^output directory: .*$#output directory: [job-local]#'

      - name: Upload the verified portable kernel packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-build
          path: |
            build/lexr/kernel-ci/linux-image-*-qcom-x1e_*_arm64.deb
            build/lexr/kernel-ci/linux-modules-*-qcom-x1e_*_arm64.deb
            build/lexr/kernel-ci/linux-headers-*-qcom-x1e_*_arm64.deb
            build/lexr/kernel-ci/linux-qcom-x1e-headers-*_all.deb
            build/lexr/kernel-ci/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Prepare and validate release assets
        id: release-assets
        if: ${{ inputs.release }}
        env:
          REQUESTED_RELEASE_NAME: ${{ inputs.release-name }}
        run: |
          set -euo pipefail

          build_dir="build/lexr/kernel-ci"
          provenance_file="${build_dir}/linux-armer-kernel-build-provenance.json"
          bundle_file="${build_dir}/linux-armer-kernel-bundle.json"

          source_url="$(jq -er '.git_url | strings' "${provenance_file}")"
          source_revision="$(jq -er '.revision | strings' "${provenance_file}")"
          source_tree="$(jq -er '.tree | strings' "${provenance_file}")"
          if [[ ! "${source_revision}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] ||
             [[ ! "${source_tree}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf 'Native build provenance contains an invalid Git object identity.\n' >&2
            exit 1
          fi

          source_checkout="${RUNNER_TEMP}/kernel-release-source"
          release_inputs="${RUNNER_TEMP}/kernel-release-inputs"
          mkdir -m 0700 "${source_checkout}" "${release_inputs}"
          git -C "${source_checkout}" init --quiet
          git -C "${source_checkout}" remote add origin "${source_url}"
          git -C "${source_checkout}" fetch --depth=1 --no-tags origin "${source_revision}"

          fetched_revision="$(git -C "${source_checkout}" rev-parse 'FETCH_HEAD^{commit}')"
          fetched_tree="$(git -C "${source_checkout}" rev-parse "${fetched_revision}^{tree}")"
          if [[ "${fetched_revision}" != "${source_revision}" ]] ||
             [[ "${fetched_tree}" != "${source_tree}" ]]; then
            printf 'Fetched corresponding source differs from the native build provenance.\n' >&2
            exit 1
          fi

          source_archive="${release_inputs}/linux-${source_revision}.tar.gz"
          licence_file="${release_inputs}/COPYING"
          git -C "${source_checkout}" archive \
            --format=tar.gz \
            --prefix="linux-${source_revision}/" \
            --output="${source_archive}" \
            "${source_revision}"
          git -C "${source_checkout}" show "${source_revision}:COPYING" > "${licence_file}"
          test -s "${source_archive}"
          test -s "${licence_file}"
          gzip --test "${source_archive}"
          tar -xOf "${source_archive}" "linux-${source_revision}/COPYING" |
            cmp --silent "${licence_file}" -

          release_name="${REQUESTED_RELEASE_NAME}"
          if [[ -z "${release_name}" ]]; then
            kernel_abi="$(jq -er '.abi | strings' "${bundle_file}")"
            release_name="sp11-kernel-${kernel_abi}"
          fi
          if [[ ! "${release_name}" =~ ^sp11-kernel-[A-Za-z0-9][A-Za-z0-9._-]{0,114}$ ]] ||
             [[ "${release_name}" == *".."* ]]; then
            printf 'Kernel release names must begin with sp11-kernel- and contain only letters, digits, dots, underscores, or hyphens.\n' >&2
            exit 1
          fi

          release_dir="build/release/${release_name}"
          "${RUNNER_TEMP}/lexr" kernel release prepare \
            --build-dir "${build_dir}" \
            --output-dir "${release_dir}" \
            --release-name "${release_name}" \
            --source "${source_archive}" \
            --licence "${licence_file}"
          "${RUNNER_TEMP}/lexr" kernel release validate \
            --json "${release_dir}" > "${RUNNER_TEMP}/kernel-release-validation.json"

          jq -e --arg release_name "${release_name}" \
            '.release_name == $release_name and
             .experimental == true and
             .hardware_qualified == false and
             ([.assets[].kind] | index("source") != null) and
             ([.assets[].kind] | index("licence") != null)' \
            "${RUNNER_TEMP}/kernel-release-validation.json" >/dev/null
          (
            cd "${release_dir}"
            sha256sum --check SHA256SUMS
          )

          printf 'release-name=%s\n' "${release_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload validated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.release && steps.release-assets.outputs.release-name != '' }}
        with:
          name: release-assets
          path: build/release/${{ steps.release-assets.outputs.release-name }}/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish OE kernel prerelease
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ inputs.release && github.ref == 'refs/heads/main' && needs.build.outputs.release-name != '' }}
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out Lexr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum

      - name: Compile the release validator
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "${RUNNER_TEMP}/lexr" ./cmd/lexr

      - name: Download validated release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Revalidate the OE publication boundary
        id: publication-boundary
        env:
          RELEASE_NAME: ${{ needs.build.outputs.release-name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_NAME}" =~ ^sp11-kernel-[A-Za-z0-9][A-Za-z0-9._-]{0,114}$ ]] ||
             [[ "${RELEASE_NAME}" == *".."* ]]; then
            printf 'The hosted publisher rejected a kernel release name outside the sp11-kernel namespace.\n' >&2
            exit 1
          fi

          validation_file="${RUNNER_TEMP}/hosted-kernel-release-validation.json"
          "${RUNNER_TEMP}/lexr" kernel release validate \
            --json release-assets > "${validation_file}"
          jq -e --arg release_name "${RELEASE_NAME}" \
            '.release_name == $release_name and
             .experimental == true and
             .hardware_qualified == false and
             ([.assets[].kind] | index("source") != null) and
             ([.assets[].kind] | index("licence") != null)' \
            "${validation_file}" >/dev/null
          (
            cd release-assets
            sha256sum --check SHA256SUMS
          )

          oe_remote="https://github.com/ooaklee/linux-surface-pro-11-oe.git"
          oe_main_revision="$(
            git ls-remote --exit-code --refs "${oe_remote}" refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ ! "${oe_main_revision}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf 'Could not resolve OE main to one exact Git revision.\n' >&2
            exit 1
          fi
          existing_tag="$(
            git ls-remote --refs "${oe_remote}" "refs/tags/${RELEASE_NAME}"
          )"
          if [[ -n "${existing_tag}" ]]; then
            printf 'The OE release tag already exists; refusing to reuse it.\n' >&2
            exit 1
          fi

          printf 'release-name=%s\n' "${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"
          printf 'oe-main-revision=%s\n' "${oe_main_revision}" >> "${GITHUB_OUTPUT}"

      - name: Publish a remotely verified OE prerelease
        env:
          GH_TOKEN: ${{ secrets.OE_RELEASE_TOKEN }}
          GH_REPO: ooaklee/linux-surface-pro-11-oe
          RELEASE_NAME: ${{ steps.publication-boundary.outputs.release-name }}
          OE_MAIN_REVISION: ${{ steps.publication-boundary.outputs.oe-main-revision }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            printf 'OE_RELEASE_TOKEN is not configured in the Lexr repository.\n' >&2
            exit 1
          fi
          if [[ ! "${OE_MAIN_REVISION}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf 'The hosted publication boundary did not supply an exact OE main revision.\n' >&2
            exit 1
          fi
          local_dir="release-assets"
          notes_file="${local_dir}/RELEASE-NOTES.md"
          test -s "${notes_file}"
          (
            cd "${local_dir}"
            sha256sum --check SHA256SUMS
          )

          mapfile -d '' -t assets < <(
            find "${local_dir}" -mindepth 1 -maxdepth 1 -type f -print0 |
              sort -z
          )
          if (( ${#assets[@]} == 0 )); then
            printf 'Validated release directory contains no uploadable assets.\n' >&2
            exit 1
          fi

          oe_remote="https://github.com/ooaklee/linux-surface-pro-11-oe.git"
          existing_tag="$(
            git ls-remote --refs "${oe_remote}" "refs/tags/${RELEASE_NAME}"
          )"
          if [[ -n "${existing_tag}" ]]; then
            printf 'The OE release tag appeared after validation; refusing to reuse it.\n' >&2
            exit 1
          fi

          gh release create "${RELEASE_NAME}" \
            --target "${OE_MAIN_REVISION}" \
            --draft \
            --title "${RELEASE_NAME}" \
            --notes-file "${notes_file}" \
            "${assets[@]}"

          created_tag_revision="$(
            git ls-remote --exit-code --refs "${oe_remote}" \
              "refs/tags/${RELEASE_NAME}" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "${created_tag_revision}" != "${OE_MAIN_REVISION}" ]]; then
            printf 'The newly created OE release tag does not identify the validated main revision.\n' >&2
            exit 1
          fi

          remote_dir="${RUNNER_TEMP}/remote-kernel-release"
          mkdir -m 0700 "${remote_dir}"
          gh release download "${RELEASE_NAME}" --dir "${remote_dir}"

          local_digests="${RUNNER_TEMP}/local-release-assets.sha256"
          remote_digests="${RUNNER_TEMP}/remote-release-assets.sha256"
          (
            cd "${local_dir}"
            LC_ALL=C sha256sum -- * > "${local_digests}"
          )
          (
            cd "${remote_dir}"
            LC_ALL=C sha256sum -- * > "${remote_digests}"
            sha256sum --check SHA256SUMS
          )
          if ! cmp --silent "${local_digests}" "${remote_digests}"; then
            printf 'Downloaded draft assets differ from the validated upload set.\n' >&2
            exit 1
          fi
          "${RUNNER_TEMP}/lexr" kernel release validate "${remote_dir}"

          promoted_tag_revision="$(
            git ls-remote --exit-code --refs "${oe_remote}" \
              "refs/tags/${RELEASE_NAME}" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "${promoted_tag_revision}" != "${OE_MAIN_REVISION}" ]]; then
            printf 'The OE release tag changed before promotion.\n' >&2
            exit 1
          fi

          gh release edit "${RELEASE_NAME}" \
            --draft=false \
            --prerelease \
            --latest=false
