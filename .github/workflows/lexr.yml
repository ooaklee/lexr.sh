name: Lexr CLI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Format, test, vet, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum

      - name: Reject tracked legacy diagnostic output
        run: |
          tracked_diagnostics="$(git ls-files -- ':(glob)**/sp11-linux-checks/**' ':(glob)**/sp11-linux-checks-*.zip' ':(glob)**/report-*/**')"
          if [[ -n "$tracked_diagnostics" ]]; then
            printf 'Private legacy diagnostic output is tracked:\n%s\n' "$tracked_diagnostics" >&2
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run race-enabled tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Linux amd64 with explicit source metadata
        run: |
          go run ./cmd/lexr-build --output "${RUNNER_TEMP}/lexr-linux-amd64"
          "${RUNNER_TEMP}/lexr-linux-amd64" version |
            grep -F "commit: ${GITHUB_SHA}"
          if go version -m "${RUNNER_TEMP}/lexr-linux-amd64" |
             grep -F $'\tbuild\tvcs.'; then
            printf 'The source builder retained ambiguous automatic VCS metadata.\n' >&2
            exit 1
          fi

      - name: Verify the immutable published IPTSD release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TEMP}/iptsd-cache"
          extract_root="${RUNNER_TEMP}/iptsd-extracted"
          target_root="${RUNNER_TEMP}/iptsd-target"
          mkdir -p "$extract_root" "$target_root"

          "${RUNNER_TEMP}/lexr-linux-amd64" userspace pull iptsd --cache-dir "$cache_root"
          bundle_root="${cache_root}/iptsd-v1/sp11-iptsd-v1"
          archive_path="${bundle_root}/sp11-iptsd-3.1.0-sp11.1-arm64.tar.xz"
          tar -xJf "$archive_path" -C "$extract_root"
          release_root="${extract_root}/sp11-iptsd-v1"

          LEXR_TEST_IPTSD_RELEASE_ROOT="$release_root" \
            go test ./internal/userspace/iptsd -run '^TestPinnedReleaseFixture$' -count=1
          "${RUNNER_TEMP}/lexr-linux-amd64" userspace install iptsd \
            --from "$bundle_root" \
            --root "$target_root" \
            --dry-run

      - name: Build every remaining release target without CGO
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "${RUNNER_TEMP}/lexr-linux-arm64" ./cmd/lexr
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o "${RUNNER_TEMP}/lexr-darwin-amd64" ./cmd/lexr
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o "${RUNNER_TEMP}/lexr-darwin-arm64" ./cmd/lexr
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "${RUNNER_TEMP}/lexr-windows-amd64.exe" ./cmd/lexr
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o "${RUNNER_TEMP}/lexr-windows-arm64.exe" ./cmd/lexr

  windows-contract:
    name: Windows hand-off contract
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run collector self-test with Windows PowerShell
        shell: powershell
        run: >-
          & .\tools\collect-sp11-windows-handoff.ps1 -SelfTest

      - name: Install pinned Pester and run collector contract tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path .\tools\tests\collect-sp11-windows-handoff.Tests.ps1 -CI

  release:
    name: Publish CLI release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - windows-contract
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: go.sum

      - name: Require publishable project licence documents
        run: |
          set -euo pipefail
          legal_documents=(LICENSE NOTICE THIRD_PARTY_NOTICES.md)
          for name in "${legal_documents[@]}"; do
            document="${GITHUB_WORKSPACE}/${name}"
            if [[ ! -f "${document}" || -L "${document}" || ! -s "${document}" ]]; then
              printf 'CLI publication is blocked: %s must be a non-empty regular repository-root file.\n' "${name}" >&2
              exit 1
            fi
          done
          printf 'Release licence documents are present: %s\n' "${legal_documents[*]}"

      - name: Validate release tag
        id: release-version
        run: |
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
            printf 'Release tag must match vMAJOR.MINOR.PATCH and use valid SemVer syntax: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          release_core="${version%%+*}"
          prerelease=false
          if [[ "$release_core" == *-* ]]; then
            prerelease=true
          fi
          {
            printf 'LEXR_VERSION=%s\n' "$version"
            printf 'LEXR_PRERELEASE=%s\n' "$prerelease"
          } >> "$GITHUB_ENV"
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" && ! "$previous_tag" =~ $tag_pattern ]]; then
            previous_tag=""
          fi
          if [[ -n "$previous_tag" ]]; then
            printf 'GORELEASER_PREVIOUS_TAG=%s\n' "$previous_tag" >> "$GITHUB_ENV"
            printf 'PREVIOUS_LEXR_TAG=%s\n' "$previous_tag" >> "$GITHUB_ENV"
          fi

      - name: Package release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --skip=publish --config .goreleaser.yaml
          workdir: .

      - name: Verify the exact CLI release set
        run: |
          set -euo pipefail

          release_dir="${RUNNER_TEMP}/lexr-release"
          mkdir -m 0700 "${release_dir}"
          expected_binaries=(
            "lexr-v${LEXR_VERSION}-darwin-amd64"
            "lexr-v${LEXR_VERSION}-darwin-arm64"
            "lexr-v${LEXR_VERSION}-linux-amd64"
            "lexr-v${LEXR_VERSION}-linux-arm64"
            "lexr-v${LEXR_VERSION}-windows-amd64.exe"
            "lexr-v${LEXR_VERSION}-windows-arm64.exe"
          )
          legal_documents=(LICENSE NOTICE THIRD_PARTY_NOTICES.md)
          expected_payloads=("${expected_binaries[@]}" "${legal_documents[@]}")

          mapfile -t artefacts < <(
            jq -er '.[] |
              select(.type == "Binary" and (.name | startswith("lexr-v"))) |
              [.name, .path] | @tsv' dist/artifacts.json |
              LC_ALL=C sort
          )
          if [[ ${#artefacts[@]} -ne ${#expected_binaries[@]} ]]; then
            printf 'Expected six named Lexr binary artefacts, found %d.\n' "${#artefacts[@]}" >&2
            exit 1
          fi

          expected_binary_names="$(printf '%s\n' "${expected_binaries[@]}" | LC_ALL=C sort)"
          artefact_names="$(printf '%s\n' "${artefacts[@]}" | cut -f1 | LC_ALL=C sort)"
          if [[ "${artefact_names}" != "${expected_binary_names}" ]]; then
            printf 'GoReleaser named a binary outside the exact release allow-list.\n' >&2
            exit 1
          fi

          for artefact in "${artefacts[@]}"; do
            IFS=$'\t' read -r name source_path <<< "${artefact}"
            resolved_source="$(realpath -e -- "${source_path}")"
            case "${resolved_source}" in
              "${GITHUB_WORKSPACE}"/dist/*) ;;
              *)
                printf 'GoReleaser binary escaped the distribution directory: %s\n' "${source_path}" >&2
                exit 1
                ;;
            esac
            if [[ ! -f "${resolved_source}" || -L "${source_path}" || ! -s "${resolved_source}" || ! -x "${resolved_source}" ]]; then
              printf 'GoReleaser binary is empty, symbolic, or non-executable: %s\n' "${source_path}" >&2
              exit 1
            fi
            install -m 0755 -- "${resolved_source}" "${release_dir}/${name}"
          done

          checksum_name="lexr-v${LEXR_VERSION}.sha256sums"
          install -m 0644 -- "dist/${checksum_name}" "${release_dir}/${checksum_name}"

          for name in "${expected_binaries[@]}"; do
            binary="${release_dir}/${name}"
            if [[ ! -f "${binary}" || -L "${binary}" || ! -s "${binary}" || ! -x "${binary}" ]]; then
              printf 'Release binary is missing, empty, symbolic, or non-executable: %s\n' "${binary}" >&2
              exit 1
            fi
            go version -m "${binary}" |
              grep -F $'path\tgithub.com/ooaklee/lexr.sh/cmd/lexr' >/dev/null
          done

          binary_checksum_names="$(awk 'NF == 2 { print $2 }' "${release_dir}/${checksum_name}" | LC_ALL=C sort)"
          if [[ "${binary_checksum_names}" != "${expected_binary_names}" ]]; then
            printf 'Checksum manifest does not cover exactly the six release binaries.\n' >&2
            exit 1
          fi
          (
            cd "${release_dir}"
            sha256sum --strict --check "${checksum_name}"
          )

          for name in "${legal_documents[@]}"; do
            source="${GITHUB_WORKSPACE}/${name}"
            if [[ ! -f "${source}" || -L "${source}" || ! -s "${source}" ]]; then
              printf 'Release licence document is missing, empty, or symbolic: %s\n' "${source}" >&2
              exit 1
            fi
            install -m 0644 -- "${source}" "${release_dir}/${name}"
          done
          (
            cd "${release_dir}"
            sha256sum -- "${legal_documents[@]}" >> "${checksum_name}"
          )

          expected_payload_names="$(printf '%s\n' "${expected_payloads[@]}" | LC_ALL=C sort)"
          checksum_names="$(awk 'NF == 2 { print $2 }' "${release_dir}/${checksum_name}" | LC_ALL=C sort)"
          if [[ "${checksum_names}" != "${expected_payload_names}" ]]; then
            printf 'Checksum manifest does not cover exactly the nine release payloads.\n' >&2
            exit 1
          fi
          (
            cd "${release_dir}"
            sha256sum --strict --check "${checksum_name}"
          )

          shopt -s nullglob dotglob
          release_files=("${release_dir}"/*)
          if [[ ${#release_files[@]} -ne 10 ]]; then
            printf 'Exact CLI release directory contains %d files, expected ten.\n' "${#release_files[@]}" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Markdown backticks are intentional literals in the generated notes.
          notes_file="${RUNNER_TEMP}/lexr-release-notes.md"
          {
            printf '# Lexr %s\n\n' "$LEXR_VERSION"
            # shellcheck disable=SC2016
            printf 'This release contains the six standalone Lexr platform executables plus `LICENSE`, `NOTICE`, and `THIRD_PARTY_NOTICES.md`. The versioned SHA-256 manifest covers all nine payload files. Kernel, firmware, driver, userspace, catalogue, collector, and other project documentation are not published here.\n\n'
            printf '## Changes\n\n'
            if [[ -n "${PREVIOUS_LEXR_TAG:-}" ]]; then
              # shellcheck disable=SC2016
              git log --format='- %s (`%h`)' "${PREVIOUS_LEXR_TAG}..${GITHUB_SHA}" -- .
            else
              # shellcheck disable=SC2016
              git log --format='- %s (`%h`)' "$GITHUB_SHA" -- .
            fi
          } > "$notes_file"

          release_flags=(
            --verify-tag
            --title "Lexr ${LEXR_VERSION}"
            --notes-file "$notes_file"
          )
          if [[ "$LEXR_PRERELEASE" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi

          release_assets=(
            "${RUNNER_TEMP}/lexr-release/lexr-v${LEXR_VERSION}-darwin-amd64"
            "${RUNNER_TEMP}/lexr-release/lexr-v${LEXR_VERSION}-darwin-arm64"
            "${RUNNER_TEMP}/lexr-release/lexr-v${LEXR_VERSION}-linux-amd64"
            "${RUNNER_TEMP}/lexr-release/lexr-v${LEXR_VERSION}-linux-arm64"
            "${RUNNER_TEMP}/lexr-release/lexr-v${LEXR_VERSION}-windows-amd64.exe"
            "${RUNNER_TEMP}/lexr-release/lexr-v${LEXR_VERSION}-windows-arm64.exe"
            "${RUNNER_TEMP}/lexr-release/LICENSE"
            "${RUNNER_TEMP}/lexr-release/NOTICE"
            "${RUNNER_TEMP}/lexr-release/THIRD_PARTY_NOTICES.md"
            "${RUNNER_TEMP}/lexr-release/lexr-v${LEXR_VERSION}.sha256sums"
          )
          gh release create "$GITHUB_REF_NAME" \
            "${release_assets[@]}" \
            "${release_flags[@]}"
