# Dependabot keeps Lexr's Go module and GitHub Actions dependencies current.
# Every dependency update also needs a fresh THIRD_PARTY_NOTICES.md review.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
